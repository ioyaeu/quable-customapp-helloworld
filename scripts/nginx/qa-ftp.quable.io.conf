server {
    server_name qa-ftp.quable.io;

    root /var/www/html;
    index index.php index.html;

    add_header Content-Security-Policy "frame-ancestors 'self' https://*.quable.io https://*.quable.com" always;

    add_header X-Content-Type-Options nosniff;
    #add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Robots-Tag none;
    add_header X-Download-Options noopen;
    add_header X-Permitted-Cross-Domain-Policies none;

    # Proxy the HelloWorld Node app early to avoid /automation conflicts
    location /quableapps/helloworld {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 301 /ftpadmin;
    }

    # /automation/quableapp[/<slot>] → app.php (sans injecter de page=)
    location ~* ^/automation/(quableapp|thirdparty|webhookbin)(?:/([^/?#]+))?$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;

        # on appelle toujours le même script
        fastcgi_param SCRIPT_FILENAME /var/www/html/app.php;
        fastcgi_param SCRIPT_NAME     /automation/app.php;

        # on passe les infos de routing à PHP
        fastcgi_param ROUTE           $1;   # quableapp | thirdparty | webhookbin
        fastcgi_param SLOT            $2;   # optionnel: document.action.single, etc.

        # on garde l'URI original pour la signature
        fastcgi_param ORIGINAL_URI    $request_uri;
    }

    # /automation/unzip → app.php (POST)
    location = /automation/unzip {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/app.php;
        fastcgi_param SCRIPT_NAME     /automation/app.php;
        fastcgi_param ROUTE           unzip;
        fastcgi_param ORIGINAL_URI    $request_uri;
    }

    location /automation {
        alias /var/www/html;
        index index.php;
        try_files $uri $uri/ /index.php?$args;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php7.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        location ~* \.(?:css|js|svg|gif|png|html|ttf|woff|ico|jpg|jpeg|csv|xlsx|zip)$ {
            try_files $uri $uri/ /index.php?$args;
            access_log off;
        }
    }

    location /assets {
        alias /var/www/assets;
        autoindex on;
        charset utf-8;
    }

    location /qa/files {
        alias /var/www/ftpdata/qa-ftp/automation;
        autoindex on;
        autoindex_format jsonp;
        charset utf-8;
        types {
            text/plain csv;
            text/plain xml;
            application/javascript                json;
        }
        location ~* \.json$ {
            add_header Content-Disposition inline;
        }
    }

    location /qa/restricted {
        alias /var/www/ftpdata/qa-ftp/automation;
        autoindex on;
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        #quable_production:TJWctgMxS
        charset utf-8;
        types {
            text/plain csv;
            text/plain xml;
            text/plain json;
        }
    }

    location /ftpadmin {
        #alias /usr/share/phpftpadminadmin/htdocs;
        alias /var/www/proftpd-admin;
        index index.php;
        try_files @ftpadmin $uri/;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass   unix:/run/php/php7.4-fpm.sock;
            fastcgi_param  SCRIPT_FILENAME  $request_filename;
        }

        location ~* \.(?:css|js)$ {
            try_files @ftpadmin $uri /index.php$uri$is_args$args;
            add_header Cache-Control "public, max-age=7200";
            # Add headers to serve security related headers (It is intended to
            # have those duplicated to the ones above)
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-XSS-Protection "1; mode=block";
            add_header X-Robots-Tag none;
            add_header X-Download-Options noopen;
            add_header X-Permitted-Cross-Domain-Policies none;
            # Optional: Don't log access to assets
            access_log off;
        }

        location ~* \.(?:svg|gif|png|html|ttf|woff|ico|jpg|jpeg)$ {
            try_files @ftpadmin $uri /index.php$uri$is_args$args;
            # Optional: Don't log access to other assets
            access_log off;
        }
    }

    location @ftpadmin {
        rewrite /ftpadmin/(.*)$ /ftpadmin/index.php?/$1 last;
    }


    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qa-ftp.quable.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qa-ftp.quable.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = qa-ftp.quable.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name qa-ftp.quable.io;
    return 404; # managed by Certbot
}
